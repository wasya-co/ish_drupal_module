
ish_drupal_module.paragraphs:
  path: '/admin/paragraphs'
  defaults:
    _controller: '\Drupal\ish_drupal_module\Controller\ParagraphTypesController::index'
    _title: 'Paragraph types'
  requirements:
    _permission: 'administer paragraphs types'
ish_drupal_module.paragraphs_category:
  path: '/admin/paragraphs/{category}'
  defaults:
    _controller: '\Drupal\ish_drupal_module\Controller\ParagraphTypesController::index'
    _title: 'Paragraph types'
  requirements:
    _permission: 'administer paragraphs types'


ish_drupal_module.settings:
  path: '/admin/config/ish_drupal_module/settings'
  defaults:
    _form: '\Drupal\ish_drupal_module\Form\SettingsForm'
    _title: 'ish_drupal_module Settings'
  requirements:
    _permission: 'administer site configuration'

ish_drupal_module.aphorisms_new:
  path: "/aphorisms/new"
  defaults:
    _form: '\Drupal\ish_drupal_module\Form\AphorismsNewForm'
    # _controller: '\Drupal\ish_drupal_module\Controller\AphorismsController::new'
    # _entity_form: node.edit
    # _title: 'New Aphorism'
  requirements:
    _role: 'content_contributor, authenticated_user'
  options:
    parameters:


ish_drupal_module.article_generate:
  path: '/articles/generate'
  defaults:
    _form: '\Drupal\ish_drupal_module\Form\ArticleGenerateForm'
    _title: 'Generate an Article'
  requirements:
    _role: 'administrator'

ish_drupal_module.article_translate:
  path: '/articles/{id}/translate-to/{langcode}'
  defaults:
    _title: 'Translate this article'
    _controller: '\Drupal\ish_drupal_module\Controller\ArticlesController::translateOne'
  requirements:
    _role: 'administrator'

ish_drupal_module.articles_missing_translation:
  path: '/articles/missing-translation'
  defaults:
    _title: 'Articles Missing Translation'
    _controller: '\Drupal\ish_drupal_module\Controller\ArticlesController::missingTranslation'
  requirements:
    _role: 'administrator'


ish_drupal_module.contrbuted_post_form:
  path: '/contributed_posts/new'
  defaults:
    _title: 'New Contributed Post'
    _form: '\Drupal\ish_drupal_module\Form\ContributedPostForm'
  requirements:
    _permission: 'create contributed_post content'
    # _access: 'TRUE'

ish_drupal_module.node.create_for_youtube:
  path: '/node/add/advanced_page/for_youtube'
  defaults:
    _form: '\Drupal\ish_drupal_module\Form\ForYoutube'
    _title: 'New Advanced Page for Youtube'
  requirements:
    _role: 'content_editor'


ish_drupal_module.locations_follow:
  path: "/locations/{id}/follow"
  defaults:
    _controller: '\Drupal\ish_drupal_module\Controller\LocationsController::follow'
  requirements:
    _permission: 'access content'
  methods: 'POST'
  options:
    parameters:
      id:

ish_drupal_module.locations_index:
  path: '/locations2'
  defaults:
    _controller: '\Drupal\ish_drupal_module\Controller\LocationsController::index'
  requirements:
    _permission: 'access content'

ish_drupal_module.locations_show:
  path: "/locations/{slug}"
  defaults:
    _controller: '\Drupal\ish_drupal_module\Controller\LocationsController::show'
    # custom_arg: 2013
  requirements:
    _permission: 'access content'
  options:
    parameters:
      slug:



ish_drupal_module.my_feed:
  path: '/locations/my-feed'
  defaults:
    _controller: '\Drupal\ish_drupal_module\Controller\LocationsController::myFeed'
  requirements:
    _permission: 'access content'

