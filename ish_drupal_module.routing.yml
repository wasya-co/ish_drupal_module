

ish_drupal_module.admin_home:
  path: '/admin/ish_drupal_module'
  defaults:
    _controller: '\Drupal\ish_drupal_module\Controller\AdminController::index'
    _title: 'admin home | ish_drupal_module'
  requirements:
    _permission: 'administer content'


ish_drupal_module.admin_put_content:
  path: '/admin/ish_drupal_modle/put_content'
  defaults:
    _form: '\Drupal\ish_drupal_module\Form\PutContentForm'
    _title: 'Replace Content'
  requirements:
    _permission: 'administer content'



ish_drupal_module.admin_recreate_layout:
  path: '/admin/ish_drupal_module/recreate_layout'
  defaults:
    _controller: '\Drupal\ish_drupal_module\Controller\AdminController::recreate_layout'
    _title: 'Recreate Layout'
  requirements:
    _permission: 'administer content'



##
## API keys, attached libraries
##
ish_drupal_module.admin_settings:
  path: '/admin/ish_drupal_module/settings'
  defaults:
    _form: '\Drupal\ish_drupal_module\Form\SettingsForm'
    _title: 'ish_drupal_module Settings'
  requirements:
    _permission: 'administer site configuration'


ish_drupal_module.admin_paragraphs:
  path: '/admin/paragraphs'
  defaults:
    _controller: '\Drupal\ish_drupal_module\Controller\ParagraphTypesController::index'
    _title: 'Paragraph types'
  requirements:
    _permission: 'administer paragraphs types'
ish_drupal_module.admin_paragraphs_category:
  path: '/admin/paragraphs/{category}'
  defaults:
    _controller: '\Drupal\ish_drupal_module\Controller\ParagraphTypesController::index'
    _title: 'Paragraph types'
  requirements:
    _permission: 'administer paragraphs types'

ish_drupal_module.article_generate:
  path: '/articles/generate'
  defaults:
    _form: '\Drupal\ish_drupal_module\Form\ArticleGenerateForm'
    _title: 'Generate an Article'
  requirements:
    _role: 'administrator'

ish_drupal_module.article_translate:
  path: '/articles/{id}/translate-to/{langcode}'
  defaults:
    _title: 'Translate this article'
    _controller: '\Drupal\ish_drupal_module\Controller\ArticlesController::translateOne'
  requirements:
    _role: 'administrator'

ish_drupal_module.articles_missing_translation:
  path: '/articles/missing-translation'
  defaults:
    _title: 'Articles Missing Translation'
    _controller: '\Drupal\ish_drupal_module\Controller\ArticlesController::missingTranslation'
  requirements:
    _role: 'administrator'

## *M*

## *T*

ish_drupal_module.tmp:
  path: '/tmp'
  defaults:
    _controller: '\Drupal\ish_drupal_module\Controller\TmpController::tmp'
  requirements:
    _role: 'administrator'
