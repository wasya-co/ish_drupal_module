---

- type: 'menu'
  id: 'main'
  links:
    - title: Home
      url: /home
      weight: 1
    - title: Events
      url: /events
      weight: 2
    - title: Careers
      url: /careers
      weight: 3
    - title: Contact Us
      url: /contact-us
      weight: 4

- type: basic
  info: preheader_contact_info
  fields:
    field_body:
      value: |
        <ul>
          <li>(512) 514-5650</li>
          <li>info@mavericksdancehall.com</li>
          <li>facebook</li>
        </ul>

- type: advanced_block
  info: facebook_bottom
  fields:
    field_body:
      format: 'full_html'
      value: |
        <a target='_blank' href='https://www.facebook.com/mavericksdancehallbuda'>Facebook</a>


- type: 'webform'
  id: 'contact_us_simple'
  title: 'Contact Us'
  elements:
    name: {}
    email: {}
    message:
      type: 'textarea'

- type: webform
  id: careers
  title: careers
  elements:
    name: {}
    email: {}
    message:
      type: 'textarea'


- type: issue
  path: /careers
  fields:
    title: Careers
    body:
      value: |
        <p>Apply now</p>
        <h5>Buda</h5>
        <p>Our Buda location is currently taking applications for:</p>
        <ul>
          <li>Security Personnel</li>
          <li>Bartenders</li>
          <li>Cocktails</li>
          <li>Bar Backs</li>
          <li>Front Desk</li>
        </ul>
  sections:
    - type: layout_onecol_any
      regions:
        main:
          - 'field:body'
          - 'webform:careers'

- type: basic
  info: copyright
  fields:
    field_body:
      value: |
        <span>Copyright © 2026 Mavericks Dance Hall. Hosted by <a href='https://wasyaco.com/?utm_campaign=mavericks'>wasya.co</a></span>

- type: 'section_callout_parallax'
  meta:
    replace: false
  info: 'main_hero'
  fields:
    field_image_hero: 'https://buda.mavericksdancehall.com/wp-content/uploads/sites/5/2022/02/randall-king-wallpaper.jpg'
    field_class_name: 'a2026_main_hero'
    field_custom_css: |
      .a2026_main_hero { height: 100vh; }

- type: advanced_block
  info: map
  fields:
    field_body:
      value: <div>The map</div>


- path: /contact-us
  type: issue
  fields:
    title: Contact Us
    body:
      value: |
        <h5>More Info</h5>
        <p>Feel free to contact us with any questions...</p>
  sections:
    - type: layout_onecol_any
      regions:
        main:
          - 'advanced_block:map'
    - type: layout_twocol_any
      regions:
        first:
          - 'webform:contact_us_simple'
        second:
          - 'field:body'


- info: 'main_4icon_1'
  meta:
    replace: true
  type: 'advanced_block'
  fields:
    field_class_name: a2026_main_4icon_each
    field_subtitle: FIVE BARS
    field_image_thumb: https://buda.mavericksdancehall.com/wp-content/uploads/sites/5/2019/05/saloon.png
    body: |
      <span>We have a bar on our patio and four bars positioned around the large dance floor.</span>
- info: 'main_4icon_2'
  meta:
    replace: true
  type: 'advanced_block'
  fields:
    field_class_name: a2026_main_4icon_each
    field_subtitle: LIVE MUSIC
    field_image_thumb: https://buda.mavericksdancehall.com/wp-content/uploads/sites/5/2019/05/live_music.png
    body: |
      <span>We have live music and DJs to provide great entertainment all night long. Check our calendar.</span>
- info: 'main_4icon_3'
  type: 'advanced_block'
  meta:
    replace: true
  fields:
    field_class_name: a2026_main_4icon_each
    field_subtitle: LARGE DANCE FLOOR
    field_image_thumb: https://buda.mavericksdancehall.com/wp-content/uploads/sites/5/2019/05/dancing.png
    ody: |
      <span>Our large dance floor is the center of entertainment and community here at Mavericks.</span>
- info: 'main_4icon_4'
  meta:
    replace: true
  type: 'advanced_block'
  fields:
    field_class_name: a2026_main_4icon_each
    field_subtitle: HUGE PATIO
    field_image_thumb: https://buda.mavericksdancehall.com/wp-content/uploads/sites/5/2019/05/games.png
    body: |
      <span>Our patio provides a relaxing and fun atmosphere with games and live DJs Thur-Sat.</span>


- path: /home
  type: 'issue'
  meta:
    replace: true
  fields:
    title: 'Home'
  sections:
    - type: 'layout_onecol_any'
      regions:
        main:
          - 'section_callout_parallax:main_hero'
    - type: 'layout_fourcol_any'
      col1_classes: col-6 col-md-3
      col2_classes: col-6 col-md-3
      col3_classes: col-6 col-md-3
      col4_classes: col-6 col-md-3
      fields:
        field_image_hero: https://buda.mavericksdancehall.com/wp-content/uploads/sites/5/2015/10/brickwall.jpg
        field_class_name: a2026_main_4iconW
        field_custom_css: |
          .a2026_main_4iconW {
            background-repeat: repeat;
            text-align: center;
          }
      regions:
        first:
          - type: advanced_block
            info: main_4icon_1
        second:
          - type: advanced_block
            info: main_4icon_2
        third:
          - type: advanced_block
            info: main_4icon_3
        fourth:
          - type: advanced_block
            info: main_4icon_4

    - label: layout_threecol_any
      type: layout_threecol_any
      col1_classes: col-12 col-md-4
      col2_classes: col-12 col-md-4
      col3_classes: col-12 col-md-4
      fields:
        field_class_name: 'a2026_main_imgs_promo'
        field_custom_css: |
          .a2026_main_imgs_promo {
            background-color: rgb(23, 26, 46);
          }
      regions:
        first:
          - info: home_college_prep
            type: advanced_block
            meta:
              replace: true
            fields:
              body:
                format: full_html
                value: |
                  <img style="width: 100%; height: auto;" src='https://buda.mavericksdancehall.com/wp-content/uploads/sites/5/2025/04/buda-college-prep-wed-vert.jpg' />
        second:
          - info: home_college_night
            type: advanced_block
            meta:
              replace: true
            fields:
              body:
                format: full_html
                value: |
                  <img style="width: 100%; height: auto;" src='https://buda.mavericksdancehall.com/wp-content/uploads/sites/5/2021/02/CollegeNight2021-Buda-vertical-980x1515.jpg' alt='' />
        third:
          - info: home_dukes
            type: advanced_block
            meta:
              replace: true
            fields:
              body:
                format: full_html
                value: |
                  <img style="width: 100%; height: auto;" src='https://buda.mavericksdancehall.com/wp-content/uploads/sites/5/2026/03/DukesBoots2023-980x1515.jpg' alt='' />

    - label: promos bottom row
      type: layout_twocol_any
      col1_classes: col-12 col-md-4 offset-md-2
      col2_classes: col-12 col-md-4
      regions:
        first:
          - type: advanced_block
            info: home_lessons
            fields:
              body:
                value: <img src='https://buda.mavericksdancehall.com/wp-content/uploads/sites/5/2023/04/red-dirt-dance-lessons2023-980x1515.jpg' alt='' />
        second:
          - type: advanced_block
            info: home_promo_events
            fields:
              body:
                value: |
                  <a href="https://buda.mavericksdancehall.com/wp-content/uploads/sites/5/2023/05/Buda-Events-Print2023.jpg">
                    <img src='https://buda.mavericksdancehall.com/wp-content/uploads/sites/5/2023/05/Buda-Events-Print2023.jpg' />
                  </a>

    - label: CHECK OUT OUR EVENT SCHEDULE
      type: layout_onecol_any
      regions:
        main:
          - type: advanced_block
            info: home_section_2links
            fields:
              body:
                value: |
                  <h3>CHECK OUT OUR EVENT SCHEDULE</h3>
                  <ul>
                    <li><a href='/events' class='btn btn-primary'>Calendar</a></li>
                    <li><a href='/tickets' class='btn btn-primary'>Tickets</a></li>
                  </ul>

    - label: contact_us
      type: layout_twocol_any
      col1_classes: col-12 col-md-6
      col2_classes: col-12 col-md-6
      regions:
        first:
          - type: advanced_block
            info: home_country_dance
            fields:
              body:
                value: <img src='https://buda.mavericksdancehall.com/wp-content/uploads/sites/5/2019/10/country_dance.jpg' />

        second:
          - type: webform
            webform_id: contact_us_simple

    - label: visit_us
      type: layout_onecol_any
      regions:
        main:
          - type: advanced_block
            info: home_link2_map
            fields:
              body:
                value: |
                  <h3>Open Wednesday through Saturday 7pm to 2am</h3>
                  <ul>
                    <li><a href='https://www.google.com/maps/place/Mavericks+Dance+Hall/@30.4566767,-97.663402,17z/data=!3m1!4b1!4m5!3m4!1s0x0:0x4fb92b622be36125!8m2!3d30.4566767!4d-97.6612133' class='btn btn-primary'>Visit Us!</a></li>
                  </ul>
